services:
  web:
    build: .
    container_name: argon-learning-web
    ports:
      - '4200:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - argon-learning-network
    restart: unless-stopped

networks:
  argon-learning-network:
    external: true
