<div class="shell">
  <a class="oq-skip-link" href="#main-content">Skip to main content</a>

  <header class="shell__topbar">
    <button
      type="button"
      class="shell__menu-btn"
      (click)="toggleDrawer()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="drawerOpen()"
      aria-controls="app-sidebar-nav"
    >
      <oq-icon name="menu" [size]="18" />
      <span>Menu</span>
    </button>

    <a class="shell__brand" routerLink="/dashboard">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="8" fill="var(--oq-accent)" />
        <circle cx="13.5" cy="13.5" r="5.25" stroke="#fff" stroke-width="2.2" />
        <path d="M17.5 17.5 21 21" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      </svg>
      <span>OpenQuiz</span>
    </a>

    <button
      type="button"
      class="oq-btn oq-btn--secondary oq-btn--sm shell__theme-btn"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="
        'Switch to ' + (themeService.theme() === 'light' ? 'dark' : 'light') + ' theme'
      "
    >
      <oq-icon [name]="themeService.theme() === 'light' ? 'moon' : 'sun'" [size]="15" />
      <span>{{ themeService.theme() === 'light' ? 'Dark' : 'Light' }}</span>
    </button>
  </header>

  @if (drawerOpen()) {
    <div class="shell__backdrop" (click)="closeDrawer()" aria-hidden="true"></div>
  }

  <oq-sidebar
    [drawerOpen]="drawerOpen()"
    [user]="authService.user()"
    [theme]="themeService.theme()"
    (closeDrawer)="closeDrawer()"
    (toggleTheme)="themeService.toggleTheme()"
    (logout)="logout()"
  />

  <main id="main-content" tabindex="-1" class="shell__content">
    <div class="shell__container">
      <router-outlet />
    </div>
  </main>

  <nav class="shell__bottom-nav" aria-label="Mobile navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="shell__bottom-link--active"
      ariaCurrentWhenActive="page"
      class="shell__bottom-link"
    >
      <oq-icon name="layout-dashboard" [size]="18" />
      <span>Home</span>
    </a>
    <a
      routerLink="/vocabulary"
      routerLinkActive="shell__bottom-link--active"
      ariaCurrentWhenActive="page"
      class="shell__bottom-link"
    >
      <oq-icon name="book-open" [size]="18" />
      <span>Vocab</span>
    </a>
    <a
      routerLink="/flashcards"
      routerLinkActive="shell__bottom-link--active"
      ariaCurrentWhenActive="page"
      class="shell__bottom-link"
    >
      <oq-icon name="layers" [size]="18" />
      <span>Cards</span>
    </a>
    <a
      routerLink="/quizzes"
      routerLinkActive="shell__bottom-link--active"
      ariaCurrentWhenActive="page"
      class="shell__bottom-link"
    >
      <oq-icon name="help-circle" [size]="18" />
      <span>Quizzes</span>
    </a>
    <a
      routerLink="/progress"
      routerLinkActive="shell__bottom-link--active"
      ariaCurrentWhenActive="page"
      class="shell__bottom-link"
    >
      <oq-icon name="bar-chart" [size]="18" />
      <span>Streak</span>
    </a>
  </nav>
</div>
