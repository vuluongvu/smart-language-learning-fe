<div class="shell">
  <header class="shell__topbar">
    <button
      type="button"
      class="shell__menu-btn"
      (click)="toggleDrawer()"
      aria-label="Toggle navigation menu"
    >
      Menu
    </button>
    <a class="shell__brand" routerLink="/dashboard">
      <span class="shell__dot" aria-hidden="true"></span>
      <span>OpenQuiz</span>
    </a>
    <button
      type="button"
      class="oq-btn oq-btn--secondary shell__theme-btn"
      (click)="themeService.toggleTheme()"
    >
      {{ themeService.theme() === 'light' ? 'Dark' : 'Light' }}
    </button>
  </header>

  @if (drawerOpen()) {
    <div class="shell__backdrop" (click)="closeDrawer()" aria-hidden="true"></div>
  }

  <aside class="shell__sidebar" [class.shell__sidebar--open]="drawerOpen()">
    <div class="shell__sidebar-header">
      <a class="shell__brand" routerLink="/dashboard" (click)="closeDrawer()">
        <span class="shell__dot" aria-hidden="true"></span>
        <span>OpenQuiz</span>
      </a>
    </div>

    <nav class="shell__nav" aria-label="Main navigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
        (click)="closeDrawer()"
      >
        Dashboard
      </a>
      <a
        routerLink="/vocabulary"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
        (click)="closeDrawer()"
      >
        All Vocabulary
      </a>
      <a
        routerLink="/topics"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
        (click)="closeDrawer()"
      >
        Topics
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
        (click)="closeDrawer()"
      >
        Settings &amp; Profile
      </a>
    </nav>

    <div class="shell__sidebar-footer">
      @if (authService.user(); as user) {
        <div class="shell__user">
          <div class="shell__user-name">{{ user.displayName }}</div>
          <div class="shell__user-email">{{ user.email }}</div>
        </div>
      }

      <div class="shell__footer-actions">
        <button
          type="button"
          class="oq-btn oq-btn--secondary oq-btn--full"
          (click)="themeService.toggleTheme()"
        >
          Theme: {{ themeService.theme() === 'light' ? 'Light' : 'Dark' }}
        </button>
        <button type="button" class="oq-btn oq-btn--secondary oq-btn--full" (click)="logout()">
          Log out
        </button>
      </div>
    </div>
  </aside>

  <main class="shell__content">
    <router-outlet />
  </main>

  <nav class="shell__bottom-nav" aria-label="Mobile navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="shell__bottom-link--active"
      class="shell__bottom-link"
    >
      Home
    </a>
    <a
      routerLink="/vocabulary"
      routerLinkActive="shell__bottom-link--active"
      class="shell__bottom-link"
    >
      Vocabulary
    </a>
    <a
      routerLink="/topics"
      routerLinkActive="shell__bottom-link--active"
      class="shell__bottom-link"
    >
      Topics
    </a>
    <a
      routerLink="/settings"
      routerLinkActive="shell__bottom-link--active"
      class="shell__bottom-link"
    >
      Settings
    </a>
  </nav>
</div>
